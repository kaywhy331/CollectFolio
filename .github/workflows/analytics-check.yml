name: Analytics check

on:
  pull_request:
    paths:
      - "analytics/**"
      - "package.json"
      - ".github/workflows/analytics-check.yml"
      - ".github/workflows/tcgcsv-market-universe.yml"
      - ".github/workflows/cardbase-mtg-history.yml"
      - "supabase/migrations/0020_tcgcsv_market_universe.sql"
      - "supabase/migrations/0021_account_owned_sync_keys.sql"
      - "tests/tcgcsv-market-universe-migration.test.js"
      - "tests/supabase.test.js"
      - "tests/postgres/run_forecast_runtime.py"
      - "tests/postgres/run_tcgcsv_universe_runtime.py"
  push:
    branches: [main]
    paths:
      - "analytics/**"
      - "package.json"
      - ".github/workflows/analytics-check.yml"
      - ".github/workflows/tcgcsv-market-universe.yml"
      - ".github/workflows/cardbase-mtg-history.yml"
      - "supabase/migrations/0020_tcgcsv_market_universe.sql"
      - "supabase/migrations/0021_account_owned_sync_keys.sql"
      - "tests/tcgcsv-market-universe-migration.test.js"
      - "tests/supabase.test.js"
      - "tests/postgres/run_forecast_runtime.py"
      - "tests/postgres/run_tcgcsv_universe_runtime.py"

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free analytics tests
        run: PYTHONPATH=analytics/src python3 -m unittest discover -s analytics/tests -p 'test_*.py'

  market-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collectfolio_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_PASSWORD: collectfolio-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d collectfolio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - name: Install DuckDB and PostgreSQL adapters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python -m pip install -e 'analytics[market-universe]'
      - name: Prove optional adapters and pinned solver runtime are active
        run: >-
          python -c 'import duckdb, numpy, psycopg;
          assert numpy.__version__ == "2.4.2", numpy.__version__'
      - name: Run full-market and Structural Gap Lab tests with DuckDB enabled
        run: >-
          PYTHONPATH=analytics/src python3 -m unittest -v
          analytics.tests.test_tcgcsv_universe
          analytics.tests.test_structural_gap
      - name: Run fresh PostgreSQL forecast and TCGCSV runtime contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: collectfolio-ci-only
          PGDATABASE: collectfolio_ci
          COLLECTFOLIO_FORECAST_DB_TEST: collectfolio_ci
          COLLECTFOLIO_TCGCSV_DB_TEST: collectfolio_ci
          PYTHONPATH: analytics/src
        run: |
          python tests/postgres/run_forecast_runtime.py
          python tests/postgres/run_tcgcsv_universe_runtime.py
