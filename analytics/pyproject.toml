[project]
name = "collectfolio-analytics"
version = "0.1.0"
description = "Rights-gated, point-in-time analytics primitives for CollectFolio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
market-universe = [
  "duckdb>=1.2,<2",
  "ijson>=3.5,<4",
  "numpy==2.4.2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
collectfolio-cardbase-history = "collectfolio_analytics.cardbase_history_cli:main"
collectfolio-tcgcsv-universe = "collectfolio_analytics.tcgcsv_universe_cli:main"
collectfolio-tcgcsv-web-catalog = "collectfolio_analytics.tcgcsv_web_catalog_cli:main"
collectfolio-tcgcsv-panel = "collectfolio_analytics.tcgcsv_panel_cli:main"
collectfolio-structural-gap-lab = "collectfolio_analytics.structural_gap_cli:main"

[tool.collectfolio]
publication-mode = "research-only"
