[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://api.pokemontcg.io https://api.tcgdex.net https://api.scryfall.com https://db.ygoprodeck.com https://images.pokemontcg.io https://images.scrydex.com https://assets.tcgdex.net https://cards.scryfall.io https://images.ygoprodeck.com https://*.supabase.co; img-src 'self' data: blob: https://images.pokemontcg.io https://images.scrydex.com https://assets.tcgdex.net https://cards.scryfall.io https://images.ygoprodeck.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
