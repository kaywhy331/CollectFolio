<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1218">
    <meta name="description" content="A local-first portfolio for cards, comics, slabs, and collectibles.">
    <title>CollectFolio</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/runtime-config.js"></script>
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <noscript>CollectFolio requires JavaScript for local storage and image processing.</noscript>
    <div id="app" class="app-shell">
      <aside class="shell-sidebar" aria-label="CollectFolio application">
        <div class="shell-brand" aria-label="CollectFolio">
          <span class="shell-brand-mark" aria-hidden="true">CF</span>
          <span><strong>CollectFolio</strong><small>Portfolio workspace</small></span>
        </div>
        <nav class="primary-nav" aria-label="Primary">
          <button class="nav-item" type="button" data-view="home" data-nav="overview">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3z"/></svg>
            <span class="nav-label nav-label-desktop">Overview</span><span class="nav-label nav-label-mobile">Home</span>
          </button>
          <button class="nav-item" type="button" data-view="search" data-nav="discover">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <span>Discover</span>
          </button>
          <button class="nav-item nav-add" type="button" data-view="add" data-nav="add">
            <span class="add-icon" aria-hidden="true">+</span><span>Add</span>
          </button>
          <button class="nav-item" type="button" data-view="portfolio" data-nav="portfolio" data-portfolio-target="holdings">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20v-6m5 6V8m5 12V4m5 16v-9"/></svg>
            <span>Portfolio</span>
          </button>
          <button class="nav-item" type="button" data-view="insights" data-nav="insights">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18 8 13l4 3 8-10"/><path d="M15 6h5v5"/></svg>
            <span>Insights</span>
          </button>
        </nav>
        <p class="sidebar-note">Local-first · private by default</p>
      </aside>
      <section class="shell-workspace">
        <header class="shell-topbar" aria-label="Application controls">
          <div class="portfolio-context">
            <span>Portfolio</span>
            <strong data-portfolio-label>Local portfolio</strong>
          </div>
          <button class="shell-search" type="button" data-shell-action="search" aria-label="Search cards">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <span class="shell-search-label" data-search-label>Search cards</span><kbd aria-hidden="true">/</kbd>
          </button>
          <div class="sync-status" data-sync-status="local" role="status" aria-live="polite">
            <span class="sync-dot" aria-hidden="true"></span><span data-sync-label>Saved on this device</span>
          </div>
          <button class="account-control" type="button" data-shell-action="settings" aria-label="Open settings">
            <span class="account-avatar" aria-hidden="true">CF</span><span data-account-label>Settings</span>
          </button>
        </header>
        <main id="main-content" class="view-shell" tabindex="-1" aria-live="polite"></main>
      </section>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
  </body>
</html>
