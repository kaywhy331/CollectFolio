<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1218">
    <meta name="description" content="A local-first portfolio for cards, comics, slabs, and collectibles.">
    <title>CollectFolio</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/css/app.css">
    <script src="./runtime-config.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <noscript>CollectFolio requires JavaScript for local storage and image processing.</noscript>
    <div id="app" class="app-shell">
      <main id="main-content" class="view-shell" tabindex="-1" aria-live="polite"></main>
      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item" type="button" data-view="home" aria-label="Home">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3z"/></svg><span>Home</span>
        </button>
        <button class="nav-item" type="button" data-view="search" aria-label="Search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span>Search</span>
        </button>
        <button class="nav-item nav-add" type="button" data-view="add" aria-label="Add">
          <span class="add-icon" aria-hidden="true">+</span><span>Add</span>
        </button>
        <button class="nav-item" type="button" data-view="portfolio" aria-label="Portfolio">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20v-6m5 6V8m5 12V4m5 16v-9"/></svg><span>Portfolio</span>
        </button>
        <button class="nav-item" type="button" data-view="profile" aria-label="Profile">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><span>Profile</span>
        </button>
      </nav>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
  </body>
</html>
